[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoregressive-core"
version = "0.1.0"
description = "A modular implementation of autoregressive Transformer components in PyTorch."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]