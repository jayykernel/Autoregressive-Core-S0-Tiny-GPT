[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoregressive-core"
version = "0.1.0"
description = "Modular PyTorch components for autoregressive Transformer models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]
