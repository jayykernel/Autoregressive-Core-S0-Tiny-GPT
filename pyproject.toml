[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoregressive-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch", "fastapi>=0.110", "uvicorn>=0.27"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
